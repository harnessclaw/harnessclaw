# =============================================================================
# HarnessClaw Engine — Configuration
# =============================================================================

# --- Server ---
server:
  host: "0.0.0.0"
  port: 8080

# --- Logging ---
log:
  level: "info"          # debug, info, warn, error
  format: "console"      # json, console
  output: "stdout"       # stdout, file
  # file_path: "/var/log/harnessclaw-engine/service.log"

# --- LLM Provider (all providers are routed through Bifrost SDK) ---
llm:
  default_provider: "anthropic"              # Switch to "openai" to use OpenAI
  max_retries: 3
  api_timeout: "900s"
  # First-byte watchdog: max wait between Chat() returning and the first
  # stream chunk. Disarms once any chunk arrives, so legitimate slow
  # streams aren't penalised — only catches "gateway accepted the
  # request but never sent a byte" (the 10-min orphan-timeout
  # pathology). Tune up to 180s+ if upstream models commonly take
  # 60-90s to start streaming.
  first_byte_timeout: "120s"
  # proxy_url: "http://proxy:8888"
  # custom_headers:
  #   X-Custom: "value"
  providers:
    anthropic:
      type: "anthropic"
      base_url: "your-api-url"
      api_key: "your-api-key-here"
      model: "your-model-id"
      max_tokens: 16384
#    openai:
#      type: "openai"
#      base_url: "https://api.openai.com"
#      api_key: "your-openai-api-key"
#      model: "gpt-4o"
#      max_tokens: 4096

# --- Query Engine ---
engine:
  max_turns: 50
  auto_compact_threshold: 0.8
  tool_timeout: "120s"

# --- Session ---
session:
  max_messages: 200
  idle_timeout: "30m"

# --- Channels ---
channels:
  websocket:
    enabled: true
    host: "0.0.0.0"
    port: 8081
    path: "/v1/ws"
    write_buffer: 256
    ping_interval: "30s"
    write_timeout: "10s"
    max_message_size: 524288   # 512KB
    # client_tools sets the DEFAULT routing for tools that don't opt in
    # to a specific side. Per-tool overrides (e.g. AskUserQuestion always
    # client, regardless of this flag) take precedence — see
    # internal/tool.ClientRoutedTool.
    #
    #   true  — delegate-everything mode (Claude Code CLI style: client
    #           runs Bash/Edit/Read/etc.). Pick this when your client
    #           knows how to execute every registered tool.
    #   false — server-runs-everything mode (web UI style: server has API
    #           keys for WebSearch, spawns sub-agents, etc.). The client
    #           still receives tool.call for tools marked client-routed
    #           (AskUserQuestion). This is the right setting for emma's
    #           web UI.
    client_tools: false
    # trace_frames toggles a per-outgoing-frame INFO log line capturing
    # type / card_kind / card_id / parent / seq / status / error. Off in
    # production (this flag generates one line per wire frame — 80-200
    # per plan run); flip on while debugging "step never closes" /
    # "card lineage wrong" UI issues, then grep "ws send" service.log.
    trace_frames: false
  http:
    enabled: true
    host: "0.0.0.0"
    port: 8080
    path: "/api/v1"
  feishu:
    enabled: false
    host: "0.0.0.0"
    port: 8082
    # app_id: ""
    # app_secret: ""

# --- Tools ---
tools:
  bash:
    enabled: true
    timeout: "60s"
    sandbox: false
  file_read:
    enabled: true
  file_edit:
    enabled: true
  file_write:
    enabled: true
  grep:
    enabled: true
  glob:
    enabled: true
  web_fetch:
    enabled: true
  web_search:
  # enabled: true
  # api_key:
  # api_secret:
  # app_id:
  # host: "cbm-search-api.cn-huabei-1.xf-yun.com"
  # path: "/biz/search"
  # limit: 5

  tavily_search:
    enabled: false
    api_key: ""          # set via CLAUDE_TOOLS_TAVILY_SEARCH_API_KEY or config_self.yaml
    # max_results: 5

# --- Skills ---
# Skills are loaded from the directories listed below, in order.
# Earlier directories have higher priority on name conflicts.
# Each directory is scanned for:
#   - skill-name/SKILL.md  (directory format)
# Default: ~/.harnessclaw/workspace/skills/ (when dirs is null or empty)
skills:
  dirs:
  # - "~/.harnessclaw/workspace/skills/"

# --- Console Management API ---
console:
  # Provider / agent management endpoints are served from this console
  # port, for example: http://127.0.0.1:8090/api/v1/providers
  enabled: true
  host: "0.0.0.0"
  port: 8090

# --- Permission ---
permission:
  mode: "default"        # default, plan, bypass, acceptEdits, dontAsk
  allowed_tools: []
  denied_tools: []
